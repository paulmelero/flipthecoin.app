slug: espera-esperada
_locale: es
title: Espera esperada
description: >-
  El número medio de lanzamientos necesarios para que un patrón dado aparezca por
  primera vez. Depende de cuánto se solape el patrón consigo mismo: CCC puede
  solaparse en longitudes 1, 2 y 3, lo que da una espera esperada de 2 + 4 + 8 =
  14 lanzamientos, mientras que XCC solo se solapa en longitud 3, lo que da 8. Un
  patrón puede tener una espera esperada más corta y aun así perder una carrera
  cara a cara: es la paradoja del tiempo de espera.
link: https://es.wikipedia.org/wiki/Valor_esperado
aka:
  - tiempo de espera
  - esperanza de espera
